name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '**/requirements.txt'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Явно устанавливаем allure-pytest, если его нет в requirements.txt
          pip install allure-pytest
          # Проверяем, что плагин установлен
          pip show allure-pytest

      - name: List project files (debug)
        run: |
          echo "Содержимое корня репозитория:"
          ls -la
          echo "Поиск тестов:"
          find . -name "test_*.py" -o -name "*_test.py"

      - name: Run tests with Allure
        run: |
          pytest --alluredir=allure-results || true

      - name: Check allure-results directory
        run: |
          if [ -d "allure-results" ]; then
            echo "allure-results найден:"
            ls -la allure-results
          else
            echo "allure-results НЕ создан"
          fi

      - name: Upload Allure results as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results
          if-no-files-found: warn
